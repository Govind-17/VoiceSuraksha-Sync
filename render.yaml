services:
  - type: web
    name: voicesuraksha-sync
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DETECTIF_API_KEY
        sync: false
      - key: DETECTIF_BASE_URL
        value: "https://platform.detectif.ai"
      - key: DEMO_MODE
        value: "false"
      - key: VOICESURAKSHA_DB_URL
        value: "sqlite:///./voicesuraksha.db"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: ASR_PROVIDER
        value: "sarvam"
      - key: ASR_API_KEY
        sync: false
